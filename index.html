<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarbeswar Panda - CDN Dashboard</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --border-color: #30363d;
            --success-color: #2ea44f;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            color: #fff;
            margin: 0 0 5px 0;
        }

        p {
            margin: 0;
            color: #8b949e;
            font-size: 14px;
        }

        .file-tree {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            list-style: none;
        }

        ul {
            list-style: none;
            padding-left: 20px;
            margin: 5px 0;
        }

        li {
            margin: 8px 0;
            font-size: 14px;
        }

        .folder {
            font-weight: 600;
            color: #e3b341;
            cursor: pointer;
            user-select: none;
        }

        .folder::before {
            content: "📁 ";
        }

        .file {
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .file:hover {
            border-color: var(--border-color);
            background: rgba(255, 255, 255, 0.05);
        }

        .file::before {
            content: "📄 ";
            margin-right: 5px;
        }

        .file-info {
            display: flex;
            align-items: center;
            flex-grow: 1;
        }

        .copy-btn {
            background-color: #21262d;
            color: var(--accent-color);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .copy-btn:hover {
            background-color: #30363d;
            color: #fff;
        }

        .copy-btn.copied {
            background-color: var(--success-color);
            color: #fff;
            border-color: var(--success-color);
        }

        .loading {
            color: var(--accent-color);
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>Sarbeswar Panda CDN Asset Manager</h1>
            <p>Click any file button to copy its global delivery URL</p>
        </header>

        <div id="explorer">
            <p class="loading">Scanning repository assets...</p>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const GITHUB_USER = "Sarbeswarpanda04";
        const REPO_NAME = "cdn -for-my - website"; // <-- Replace this with your exact CDN repository name if different
    const CDN_BASE_URL = "https://sarbeswarpanda.in";

        const explorerDiv = document.getElementById("explorer");

        // Helper function to build the tree recursively using GitHub API
        async function fetchRepoContents(path = "") {
            const url = `https://github.com{GITHUB_USER}/${REPO_NAME}/contents/${path}`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Failed to fetch repository files.");
                const items = await response.json();

                const ul = document.createElement("ul");

                for (const item of items) {
                    // Ignore index.html itself so it doesn't show up in your asset list
                    if (item.name === "index.html") continue;

                    const li = document.createElement("li");

                    if (item.type === "dir") {
                        const folderSpan = document.createElement("span");
                        folderSpan.className = "folder";
                        folderSpan.innerText = item.name;
                        li.appendChild(folderSpan);

                        // Lazy load subfolders when items exist
                        const subContainer = document.createElement("div");
                        li.appendChild(subContainer);

                        const subTree = await fetchRepoContents(item.path);
                        subContainer.appendChild(subTree);
                    } else if (item.type === "file") {
                        const fileWrapper = document.createElement("div");
                        fileWrapper.className = "file";

                        const infoSpan = document.createElement("span");
                        infoSpan.className = "file-info";
                        infoSpan.innerText = item.name;

                        const finalCdnUrl = `${CDN_BASE_URL}/${item.path}`;

                        const btn = document.createElement("button");
                        btn.className = "copy-btn";
                        btn.innerText = "Copy URL";
                        btn.onclick = () => copyToClipboard(finalCdnUrl, btn);

                        fileWrapper.appendChild(infoSpan);
                        fileWrapper.appendChild(btn);
                        li.appendChild(fileWrapper);
                    }
                    ul.appendChild(li);
                }
                return ul;
            } catch (error) {
                console.error(error);
                const errP = document.createElement("p");
                errP.style.color = "#f85149";
                errP.innerText = "Error loading files. Ensure the repo is public or named correctly.";
                return errP;
            }
        }

        // Copy to clipboard utility
        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                button.innerText = "Copied!";
                button.classList.add("copied");
                setTimeout(() => {
                    button.innerText = "Copy URL";
                    button.classList.remove("copied");
                }, 2000);
            }).catch(err => {
                console.error("Could not copy text: ", err);
            });
        }

        // Initialize the application layout
        async function init() {
            explorerDiv.innerHTML = "";
            const treeContainer = document.createElement("div");
            treeContainer.className = "file-tree";

            const tree = await fetchRepoContents();
            treeContainer.appendChild(tree);
            explorerDiv.appendChild(treeContainer);
        }

        init();
    </script>

</body>

</html>
